<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Único - Maria Fumaça</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">
      <div class="auth-image" style="background: url('https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&q=80') center/cover no-repeat;">
        <div class="auth-image-overlay"></div>
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <span class="material-symbols-outlined" style="color: var(--vinho-escuro); font-size: 24px;">train</span>
          </div>
          <div class="auth-logo-text">
            <h2>Maria Fumaça</h2>
            <p>Sistema Integrado de Gestão</p>
          </div>
        </div>
      </div>

      <div class="auth-form-area">
        <div class="brand-header">
          <div class="brand-icon">
            <span class="material-symbols-outlined" style="color: var(--laranja); font-size: 28px;">key</span>
          </div>
          <h2>SIGA-MF Central</h2>
          <p>Acesso unificado do sistema</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          
          <div class="form-group">
            <label style="font-size: 12px; font-weight: bold; color: var(--vinho-escuro);">Acessar qual módulo?</label>
            <select id="modulo-select" required>
              <option value="">Selecione o seu setor...</option>
              <option value="admin">Gestão (Administrador)</option>
              <option value="caixa">PDV (Caixa)</option>
              <option value="cozinha">KDS (Cozinha)</option>
              <option value="garcom">Salão (Garçom)</option>
            </select>
          </div>

          <div class="form-group">
            <input type="text" id="login" placeholder="Usuário ou E-mail" required>
          </div>
          <div class="form-group">
            <input type="password" id="password" placeholder="Senha" required>
            <span class="input-icon" onclick="togglePassword('password', this)">
              <span class="material-symbols-outlined" style="font-size: 18px;">visibility</span>
            </span>
          </div>

          <button type="submit" class="btn-primary" id="btn-submit">Acessar Sistema</button>
        </form>

        <div class="auth-footer" style="cursor: default; color: #888; margin-top: 24px;">
          <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: text-bottom;">lock</span>
          Acesso restrito aos funcionários registrados.
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
